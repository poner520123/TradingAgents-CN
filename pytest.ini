[pytest]
# 仅收集 tests/ 目录，避免误收集仓库根目录的一次性调试脚本(test_api.py 等)
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    -ra
    --strict-markers
    --tb=short

markers =
    contract: 接口契约测试（验证路由路径、入参、响应结构）
    integration: 集成测试（跨模块协作流程）
    slow: 耗时较长的测试

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

log_level = WARNING
log_cli = false

norecursedirs =
    .git
    .venv
    venv
    node_modules
    frontend
    dist
    data
    logs
    reports
    results
    eval_results
    docs
    scripts
    *.egg-info
    __pycache__
