server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;
    
    # 定义变量，用于过滤掉不需要的请求日志
    set $should_log 1;
    
    # 过滤掉meteor热更新请求
    if ($request_uri ~* "__meteor__") {
        set $should_log 0;
    }
    
    # 过滤掉sockjs请求
    if ($request_uri ~* "sockjs") {
        set $should_log 0;
    }
    
    # 主访问日志，只记录重要请求
    access_log /var/log/nginx/access.log main if=$should_log;
    # 错误日志，只记录错误信息（过滤掉notice级别的worker启动日志）
    error_log /var/log/nginx/error.log error;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # 处理热更新相关请求
    location ~* /__meteor__hmr__ {
        return 200;
    }
    
    # Main location - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JavaScript files - no cache for main entry, cache for chunks
    location ~* ^/js/.*\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.html;
    }

    # CSS files
    location ~* ^/css/.*\.css$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.html;
    }

    # Other static assets
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html - no cache
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # API proxy
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}